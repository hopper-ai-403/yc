[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-intelligence-platform"
version = "0.1.0"
description = "Production-grade Audio Intelligence Platform"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Audio Intelligence Platform" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "celery[redis]>=5.4.0",
  "flower>=2.0.1",
  "boto3>=1.35.0",
  "structlog>=24.4.0",
  "python-multipart>=0.0.12",
  "httpx>=0.28.0",
  "typing-extensions>=4.12.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
  "pyright>=1.1.390",
  "pre-commit>=4.0.0",
  "factory-boy>=3.3.0",
  "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | alembic/versions
  | node_modules
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests", "../tests"]
exclude = [
  ".git",
  ".venv",
  "alembic/versions",
  "node_modules",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
  "S",
  "ASYNC",
  "RUF",
]
ignore = [
  "S101",
  "B008",
  "N818",
  "UP040",
  "UP046",
  "UP017",
  "UP035",
  "UP042",
  "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"**/tests/**/*.py" = ["S101", "S105", "S106"]
"app/config/settings.py" = ["S104", "S105", "S108"]
"app/infrastructure/celery/tasks.py" = ["ANN001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app"]
exclude = [
  "**/__pycache__",
  ".venv",
  "alembic/versions",
]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUntypedFunctionDecorator = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "../tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "api: API tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
